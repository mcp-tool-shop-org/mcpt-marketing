name: CI

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc"
      - ".prettierignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "marketing/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc"
      - ".prettierignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run fmt:check

      - name: Schema + invariant validation
        run: npm run validate

      - name: Tests
        run: npm test

      - name: Lockfile drift check
        run: npm run lock:check
