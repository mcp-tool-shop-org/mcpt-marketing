name: CI

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc"
      - ".prettierignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "marketing/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc"
      - ".prettierignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci || (sleep 10 && npm ci)

      - name: Format check
        shell: bash
        run: |
          npm run fmt:check
          echo "- Format check: passed (\`prettier --check .\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Schema + invariant validation
        shell: bash
        run: |
          npm run validate
          echo "- Schema + invariant validation: passed (\`marketing/scripts/validate.mjs\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        shell: bash
        run: |
          npm test
          echo "- Tests: passed (\`node --test\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Lockfile drift check
        shell: bash
        run: |
          npm run lock:check
          echo "- Lockfile drift check: passed (\`gen-lock.mjs --check\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary header
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "### CI matrix cell"
            echo ""
            echo "- OS: \`${{ matrix.os }}\`"
            echo "- Node: \`${{ matrix.node-version }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
